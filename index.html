<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ItsS3id · Portafolio</title>
<meta name="description" content="Portafolio de ItsS3id: animaciones e interfaces de usuario para Roblox.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* Si subes tu fuente Highway Gothic a la carpeta "fonts" del repositorio (.woff2, .ttf u .otf), se usa sola.
     Si no, se usa Overpass, que está basada en Highway Gothic. */
  @font-face {
    font-family: "Highway Gothic";
    font-weight: 100 900;
    font-display: swap;
    src: local("Highway Gothic Bold"), local("HighwayGothic-Bold"),
      url("fonts/HighwayGothic-Bold.woff2") format("woff2"),
      url("fonts/HighwayGothic-Bold.ttf") format("truetype"),
      url("fonts/HighwayGothic-Bold.otf") format("opentype");
  }
  :root {
    --yellow: #ffc72c;
    --yellow-soft: #ffe18a;
    --orange: #ff6a13;
    --black: #16130f;
    --cream: #fff6d6;
    --font: "Highway Gothic", "Overpass", "Arial Narrow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--yellow); color: var(--black); font-family: var(--font); font-weight: 600; font-size: 1.1rem; line-height: 1.6; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; border-radius: 4px; }
  .wrap { max-width: 90rem; margin: 0 auto; padding: 0 1.5rem; }
  h1, h2, h3, strong { font-weight: 800; }

  header.top { background: var(--black); color: var(--cream); }
  header.top .wrap { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding-top: 1rem; padding-bottom: 1rem; }
  header.top strong { color: var(--yellow); font-size: 1.4rem; letter-spacing: .01em; }
  nav { display: flex; gap: 1.4rem; flex-wrap: wrap; }
  nav a { text-decoration: none; }
  nav a:hover { color: var(--orange); }

  .sign {
    margin: 3.5rem 0 4rem; padding: clamp(1.5rem, 5vw, 3.5rem);
    border: 6px solid var(--black); border-radius: 22px;
    box-shadow: 0 0 0 9px var(--yellow), 0 0 0 13px var(--black);
  }
  .strata { display: grid; grid-template-rows: 14px 14px 14px; max-width: 13rem; margin-bottom: 1.75rem; }
  .strata i:nth-child(1) { background: var(--orange); }
  .strata i:nth-child(2) { background: var(--black); }
  .strata i:nth-child(3) { background: var(--cream); }
  .sign h1 { font-size: clamp(2.8rem, 10vw, 6.5rem); line-height: .98; letter-spacing: -.01em; margin: 0 0 1.25rem; }
  .sign p { max-width: 34rem; font-size: 1.35rem; margin: 0 0 2rem; }
  .btn { display: inline-block; text-decoration: none; background: var(--black); color: var(--yellow); padding: .75rem 1.5rem; border-radius: 8px; border: 3px solid var(--black); font-weight: 800; }
  .btn:hover { background: var(--orange); color: var(--black); }
  .btn.alt { background: transparent; color: var(--black); margin-left: .5rem; }
  .btn.alt:hover { background: var(--black); color: var(--yellow); }

  section { padding: 3.5rem 0; background: linear-gradient(90deg, var(--black) 60%, transparent 0) top / 2.5rem 4px repeat-x; }
  h2 { font-size: 2.2rem; line-height: 1.1; margin: 0 0 1.5rem; }
  .about { max-width: 40rem; font-size: 1.25rem; }
  .about p { margin: 0 0 1rem; }
  .tiempo { background: var(--orange); color: var(--black); padding: .02em .55em; border-radius: 999px; white-space: nowrap; font-weight: 800; }

  .tabs { display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: 2rem; }
  .tabs button { font: inherit; font-weight: 800; cursor: pointer; background: var(--yellow-soft); color: var(--black); border: 3px solid var(--black); border-radius: 8px; padding: .6rem 1.3rem; }
  .tabs button:hover { background: var(--orange); }
  .tabs button[aria-selected="true"] { background: var(--black); color: var(--yellow); }

  .group { margin: 0 0 2.5rem; }
  .group h3 { display: inline-block; margin: 0 0 1rem; background: var(--black); color: var(--yellow); padding: .2rem 1rem; border-radius: 8px; font-size: 1.3rem; }
  .grid { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 24rem), 1fr)); }
  .card { background: var(--black); color: var(--cream); border-radius: 12px; overflow: hidden; border-bottom: 6px solid var(--orange); }
  .card img, .card video { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; }
  .card.grande { grid-column: 1 / -1; justify-self: center; width: min(100%, 52rem); animation: crece .5s cubic-bezier(.2, .8, .2, 1); }
  .card.vuelve { animation: vuelve .45s cubic-bezier(.2, .8, .2, 1); }
  .card .body { padding: .9rem 1.2rem 1.1rem; }
  .card h4 { margin: 0; font-size: 1.15rem; font-weight: 800; color: var(--yellow); }
  .card a { display: inline-block; margin-top: .4rem; color: var(--orange); }
  .empty { margin: 0; padding: 1.4rem 1.6rem; background: var(--yellow-soft); border: 3px dashed var(--black); border-radius: 12px; max-width: 34rem; }

  .skills { display: flex; flex-wrap: wrap; gap: .6rem; padding: 0; list-style: none; margin: 0; }
  .skills li { background: var(--black); color: var(--yellow); border-radius: 8px; padding: .4rem 1rem; font-weight: 800; }
  .skills li:nth-child(3n) { color: var(--orange); }

  .contact ul { list-style: none; padding: 0; margin: 0; display: grid; gap: .6rem; font-size: 1.2rem; }
  .contact a { font-weight: 800; text-underline-offset: 4px; }
  .contact a:hover { color: var(--orange); background: var(--black); padding: 0 .3rem; text-decoration: none; }

  footer { background: var(--black); color: var(--cream); padding: 1.5rem 0; }
  footer .wrap { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .75rem 1.5rem; }

  /* Valoración con estrellas */
  .rating { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
  .rating .estrellas { display: flex; gap: .1rem; }
  .rating .estrellas button { font: inherit; font-size: 1.7rem; line-height: 1; cursor: pointer; background: none; border: 0; padding: .1rem .15rem; color: #5a5144; transition: transform .2s cubic-bezier(.2, .8, .2, 1), color .2s; }
  .rating .estrellas button.on { color: var(--yellow); }
  .rating .estrellas button.mia { color: var(--orange); }
  .rating .estrellas button:hover { transform: scale(1.25) rotate(-6deg); }
  .rating .estrellas button:disabled { cursor: progress; opacity: .6; }
  .rating .resumen { font-weight: 800; color: var(--yellow); }
  .rating .resumen small { font-weight: 600; color: var(--cream); font-size: 1rem; }
  .rating .aviso { flex-basis: 100%; margin: 0; font-size: .95rem; color: var(--cream); text-align: right; }
  @media (max-width: 36rem) { .rating .aviso { text-align: left; } }

  /* Animaciones */
  .btn, .tabs button, .skills li, .card, nav a, .contact a { transition: transform .3s cubic-bezier(.2, .8, .2, 1), background-color .25s, color .25s, box-shadow .3s; }
  nav a { background: linear-gradient(var(--orange), var(--orange)) 0 100% / 0 3px no-repeat; transition: color .25s, background-size .3s; }
  nav a:hover { background-size: 100% 3px; }
  .btn:hover, .tabs button:hover { transform: translateY(-3px); }
  .btn:active, .tabs button:active { transform: scale(.96); }
  .skills li:hover { transform: translateY(-4px) rotate(-1.5deg); }
  .card:hover { transform: translateY(-6px); box-shadow: 0 18px 26px -14px rgba(22, 19, 15, .6); }
  .tiempo { display: inline-block; animation: pop .6s .5s cubic-bezier(.2, .8, .2, 1) backwards; }
  header.top { animation: baja .6s cubic-bezier(.2, .8, .2, 1) backwards; }
  .sign { animation: marco .8s cubic-bezier(.2, .8, .2, 1) backwards; }
  .strata i { transform-origin: left; animation: barra .7s cubic-bezier(.2, .8, .2, 1) backwards; }
  .strata i:nth-child(1) { animation-delay: .25s; }
  .strata i:nth-child(2) { animation-delay: .4s; }
  .strata i:nth-child(3) { animation-delay: .55s; }
  .sign h1 { animation: sube .8s .3s cubic-bezier(.2, .8, .2, 1) backwards; }
  .sign p { animation: sube .8s .45s cubic-bezier(.2, .8, .2, 1) backwards; }
  .sign .btn { animation: sube .8s .6s cubic-bezier(.2, .8, .2, 1) backwards; }
  .sign .btn.alt { animation-delay: .72s; }
  .reveal { opacity: 0; transform: translateY(26px); }
  .reveal.visto { opacity: 1; transform: none; transition: opacity .7s cubic-bezier(.2, .8, .2, 1) calc(var(--i, 0) * 80ms), transform .7s cubic-bezier(.2, .8, .2, 1) calc(var(--i, 0) * 80ms); }
  @keyframes sube { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
  @keyframes baja { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
  @keyframes barra { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes marco { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes crece { from { opacity: .5; transform: scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes vuelve { from { opacity: .7; transform: scale(1.06); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.6); } 70% { transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (max-width: 36rem) { .btn.alt { margin: .75rem 0 0; } .sign { margin-top: 2.5rem; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <strong>ItsS3id</strong>
    <nav aria-label="Principal">
      <a href="#sobre-mi">Sobre mí</a>
      <a href="#habilidades">Habilidades</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="sign">
    <div class="strata" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>Hola, soy ItsS3id.</h1>
    <p>Hago animaciones, interfaces de usuario y un poco de todo para Roblox.</p>
    <a class="btn" href="#trabajo">Ver mi trabajo</a>
    <a class="btn alt" href="#contacto">Escríbeme</a>
  </div>

  <section id="sobre-mi">
    <h2>Sobre mí</h2>
    <div class="about" id="sobre-texto"></div>
  </section>

  <section id="trabajo">
    <h2>Mi trabajo</h2>
    <div class="tabs" role="tablist" aria-label="Categorías">
      <button type="button" role="tab" id="tab-animaciones" aria-selected="true" aria-controls="panel" data-key="animaciones">Animaciones</button>
      <button type="button" role="tab" id="tab-interfaces" aria-selected="false" aria-controls="panel" data-key="interfaces">Interfaces de usuario</button>
      <button type="button" role="tab" id="tab-proyectos" aria-selected="false" aria-controls="panel" data-key="proyectos">Proyectos</button>
    </div>
    <div id="panel" role="tabpanel" aria-live="polite"></div>
  </section>

  <section id="habilidades">
    <h2>Habilidades</h2>
    <ul class="skills" id="lista-habilidades"></ul>
  </section>

  <section id="contacto" class="contact">
    <h2>Contacto</h2>
    <ul id="lista-contacto"></ul>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="anio">2026</span> ItsS3id</span>
    <div class="rating" id="valoracion">
      <div class="estrellas" id="estrellas" role="group" aria-label="Valora esta página de 1 a 5 estrellas"></div>
      <span class="resumen" id="resumen" aria-live="polite">Cargando…</span>
      <p class="aviso" id="aviso" hidden></p>
    </div>
  </div>
</footer>

<script>
  // Si la página no detecta tu repositorio sola, escribe aquí tu usuario y el nombre del repositorio.
  var REPO_USER = "";
  var REPO_NAME = "";

  // Valoraciones: pega aquí la URL de tu Firebase Realtime Database, sin barra al final.
  // Ejemplo: "https://mi-portafolio-default-rtdb.firebaseio.com"
  // Si la dejas vacía, las valoraciones solo se guardan en el navegador de cada visitante (modo de prueba).
  var RATING_DB = "https://itss3idportafolio-default-rtdb.firebaseio.com";


  // Textos de respaldo: se usan hasta que crees los archivos sobre-mi.txt, habilidades.txt y contacto.txt
  var SOBRE_DEFECTO = "inicio: 2025-08\nLlevo [tiempo] animando en Roblox. Cuéntale a tus visitantes qué haces y qué te gusta crear.";
  var HABILIDADES_DEFECTO = "Animación\nInterfaces de usuario\nRoblox Studio\nDiseño";
  var CONTACTO_DEFECTO = "Discord: TU-DISCORD\nCorreo | mailto:tucorreo@ejemplo.com";

  var SECCIONES = {
    animaciones: { carpeta: "animaciones", vacio: "No hay animaciones disponibles por ahora." },
    interfaces:  { carpeta: "interfaces",  vacio: "No hay interfaces de usuario disponibles por ahora." },
    proyectos:   { carpeta: "proyectos",   vacio: "No estoy en ningún proyecto de momento." }
  };
  var IGNORAR = ["leeme.txt", "readme.md", "readme.txt"];
  var IMG = /\.(png|jpe?g|gif|webp|avif)$/i;
  var VID = /\.(mp4|webm|mov)$/i;

  document.getElementById("anio").textContent = new Date().getFullYear();

  /* ---------- Animaciones al hacer scroll ---------- */
  var reducido = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var obs = ("IntersectionObserver" in window && !reducido) ? new IntersectionObserver(function (entradas) {
    entradas.forEach(function (e) {
      if (!e.isIntersecting) return;
      var el = e.target; obs.unobserve(el);
      el.classList.add("visto");
      var i = +el.style.getPropertyValue("--i") || 0;
      setTimeout(function () { el.classList.remove("reveal", "visto"); }, 900 + i * 80);
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" }) : null;
  function revelar(lista) {
    if (!obs) return;
    Array.prototype.forEach.call(lista, function (el) {
      var i = Array.prototype.indexOf.call(el.parentNode.children, el);
      el.style.setProperty("--i", Math.min(i, 8));
      el.classList.add("reveal"); obs.observe(el);
    });
  }
  revelar(document.querySelectorAll("section h2, .about, .tabs"));

  /* ---------- Textos editables ---------- */
  function leerTexto(archivo, defecto) {
    return fetch(archivo, { cache: "no-cache" })
      .then(function (r) { return r.ok ? r.text() : defecto; })
      .catch(function () { return defecto; })
      .then(function (t) { return t.trim() ? t : defecto; });
  }
  function lineas(texto) {
    return texto.split(/\r?\n/).map(function (l) { return l.trim(); })
      .filter(function (l) { return l && l.charAt(0) !== "#"; });
  }
  function tiempoTexto(meses) {
    if (meses < 1) return "menos de un mes";
    if (meses < 12) return meses + (meses === 1 ? " mes" : " meses");
    var a = Math.round(meses / 12 * 2) / 2;
    return a + (a === 1 ? " año" : " años");
  }
  function pintarSobreMi(texto) {
    var cont = document.getElementById("sobre-texto");
    cont.replaceChildren();
    var inicio = /inicio:\s*(\d{4})-(\d{1,2})/i.exec(texto);
    var ahora = new Date();
    var meses = inicio ? (ahora.getFullYear() - +inicio[1]) * 12 + (ahora.getMonth() + 1 - +inicio[2]) : 0;
    var cuerpo = texto.replace(/^\s*inicio:.*$/im, "").trim();
    cuerpo.split(/\n\s*\n/).forEach(function (parrafo) {
      var p = document.createElement("p");
      parrafo.trim().split(/\[tiempo[\]\[]/i).forEach(function (parte, i) {
        if (i > 0) {
          var s = document.createElement("span");
          s.className = "tiempo"; s.textContent = tiempoTexto(meses);
          p.appendChild(s);
        }
        p.appendChild(document.createTextNode(parte));
      });
      cont.appendChild(p);
    });
  }
  function pintarHabilidades(texto) {
    var ul = document.getElementById("lista-habilidades");
    ul.replaceChildren();
    lineas(texto).forEach(function (h) {
      var li = document.createElement("li"); li.textContent = h; ul.appendChild(li);
    });
    revelar(ul.children);
  }
  function pintarContacto(texto) {
    var ul = document.getElementById("lista-contacto");
    ul.replaceChildren();
    lineas(texto).forEach(function (l) {
      var li = document.createElement("li");
      var i = l.indexOf("|");
      var enlace = i > -1 ? l.slice(i + 1).trim() : "";
      if (i > -1 && /^(https?:|mailto:)/i.test(enlace)) {
        var a = document.createElement("a");
        a.href = enlace; a.textContent = l.slice(0, i).trim();
        li.appendChild(a);
      } else {
        li.textContent = i > -1 ? l.slice(0, i).trim() : l;
      }
      ul.appendChild(li);
    });
    revelar(ul.children);
  }
  pintarSobreMi(SOBRE_DEFECTO); pintarHabilidades(HABILIDADES_DEFECTO); pintarContacto(CONTACTO_DEFECTO);
  leerTexto("sobre-mi.txt", SOBRE_DEFECTO).then(pintarSobreMi);
  leerTexto("habilidades.txt", HABILIDADES_DEFECTO).then(pintarHabilidades);
  leerTexto("contacto.txt", CONTACTO_DEFECTO).then(pintarContacto);

  /* ---------- Trabajo (lee las carpetas del repositorio) ---------- */
  function detectarRepo() {
    var user = REPO_USER, repo = REPO_NAME;
    var host = location.hostname;
    if (!user && /\.github\.io$/i.test(host)) {
      user = host.split(".")[0];
      var primero = location.pathname.split("/")[1];
      repo = repo || (primero ? primero : user + ".github.io");
    }
    return { user: user, repo: repo };
  }
  function titulo(nombre) { return nombre.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ").trim(); }
  function mensaje(texto) { var p = document.createElement("p"); p.className = "empty"; p.textContent = texto; return p; }
  function ruta(path) { return path.split("/").map(encodeURIComponent).join("/"); }

  var arbol = null;
  function obtenerArbol() {
    if (arbol) return arbol;
    var r = detectarRepo();
    if (!r.user) { arbol = Promise.resolve([]); return arbol; }
    var base = "https://api.github.com/repos/" + r.user + "/" + r.repo + "/git/trees/";
    function pedir(rama) {
      return fetch(base + rama + "?recursive=1", { headers: { "Accept": "application/vnd.github+json" } })
        .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); });
    }
    arbol = pedir("HEAD").catch(function () { return pedir("main"); }).then(function (d) {
      return d.tree.filter(function (n) { return n.type === "blob"; }).map(function (n) { return n.path; });
    });
    arbol.catch(function () { arbol = null; });
    return arbol;
  }

  function agrupar(rutas, carpeta) {
    var grupos = {};
    rutas.forEach(function (p) {
      if (p.toLowerCase().indexOf(carpeta + "/") !== 0) return;
      var partes = p.slice(carpeta.length + 1).split("/");
      var nombre = partes[partes.length - 1];
      if (partes.some(function (s) { return s.charAt(0) === "."; })) return;
      if (IGNORAR.indexOf(nombre.toLowerCase()) > -1) return;
      var g = partes.length > 1 ? partes[0] : "";
      (grupos[g] = grupos[g] || []).push({ path: p, name: nombre });
    });
    return grupos;
  }

  function tarjeta(f) {
    var card = document.createElement("article"); card.className = "card";
    var src = ruta(f.path), nombre = titulo(f.name);
    if (IMG.test(f.name)) {
      var img = document.createElement("img"); img.src = src; img.alt = nombre; img.loading = "lazy"; card.appendChild(img);
    } else if (VID.test(f.name)) {
      var v = document.createElement("video"); v.src = src + "#t=0.1"; v.controls = true; v.preload = "metadata"; v.setAttribute("playsinline", "");
      v.loop = true;
      v.addEventListener("play", function () { clearTimeout(card._t); ampliar(card, v); });
      v.addEventListener("pause", function () {
        clearTimeout(card._t);
        card._t = setTimeout(function () { if (v.paused && !v.seeking) achicar(card); }, 350);
      });
      card.appendChild(v);
    }
    var body = document.createElement("div"); body.className = "body";
    var h = document.createElement("h4"); h.textContent = nombre; body.appendChild(h);
    if (!IMG.test(f.name) && !VID.test(f.name)) {
      var a = document.createElement("a"); a.href = src; a.textContent = "Abrir archivo"; body.appendChild(a);
    }
    card.appendChild(body);
    return card;
  }

  function achicar(card) {
    if (!card.classList.contains("grande")) return;
    card.classList.remove("grande");
    card.classList.add("vuelve");
    setTimeout(function () { card.classList.remove("vuelve"); }, 450);
  }

  // Al reproducir un video, su tarjeta se agranda y las demás se acomodan alrededor.
  function ampliar(card, video) {
    document.querySelectorAll(".card.grande").forEach(function (c) { if (c !== card) achicar(c); });
    document.querySelectorAll(".card video").forEach(function (o) { if (o !== video) o.pause(); });
    if (card.classList.contains("grande")) return;
    card.classList.add("grande");
    var suave = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(function () { card.scrollIntoView({ block: "center", behavior: suave ? "smooth" : "auto" }); }, 50);
  }

  function pintar(panel, seccion, grupos) {
    var claves = Object.keys(grupos).sort(function (a, b) { return a.localeCompare(b, "es", { numeric: true }); });
    if (!claves.length) { panel.replaceChildren(mensaje(seccion.vacio)); return; }
    panel.replaceChildren();
    claves.forEach(function (clave) {
      var grupo = document.createElement("div"); grupo.className = "group";
      if (clave) { var h = document.createElement("h3"); h.textContent = titulo(clave); grupo.appendChild(h); }
      var grid = document.createElement("div"); grid.className = "grid";
      grupos[clave].sort(function (a, b) { return a.name.localeCompare(b.name, "es", { numeric: true }); })
        .forEach(function (f) { grid.appendChild(tarjeta(f)); });
      grupo.appendChild(grid);
      panel.appendChild(grupo);
    });
  }

  function cargar(clave) {
    var panel = document.getElementById("panel");
    var seccion = SECCIONES[clave];
    panel.setAttribute("aria-labelledby", "tab-" + clave);
    panel.replaceChildren(mensaje("Cargando…"));
    obtenerArbol().then(function (rutas) {
      pintar(panel, seccion, agrupar(rutas, seccion.carpeta));
      revelar(panel.querySelectorAll(".card, .group h3, .empty"));
    }).catch(function () {
      panel.replaceChildren(mensaje("No se pudo cargar esta sección. Intenta de nuevo en unos minutos."));
    });
  }

  var botones = document.querySelectorAll(".tabs button");
  botones.forEach(function (b) {
    b.addEventListener("click", function () {
      botones.forEach(function (o) { o.setAttribute("aria-selected", o === b ? "true" : "false"); });
      cargar(b.getAttribute("data-key"));
    });
  });
  cargar("animaciones");

  /* ---------- Valoración con estrellas ---------- */
  (function () {
    var KEY_MIA = "itss3id-mi-voto";
    var KEY_LOCAL = "itss3id-votos-local";
    var cont = document.getElementById("estrellas");
    var resumen = document.getElementById("resumen");
    var aviso = document.getElementById("aviso");
    var db = RATING_DB.replace(/\/+$/, "");
    var votos = { s1: 0, s2: 0, s3: 0, s4: 0, s5: 0 };
    var miVoto = 0, ocupado = false;

    function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function decir(t) { aviso.textContent = t; aviso.hidden = !t; }

    miVoto = +leer(KEY_MIA) || 0;

    var estrellas = [1, 2, 3, 4, 5].map(function (n) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = "★";
      b.setAttribute("aria-label", n + (n === 1 ? " estrella" : " estrellas"));
      b.addEventListener("click", function () { votar(n); });
      b.addEventListener("mouseenter", function () { marcar(n, false); });
      b.addEventListener("focus", function () { marcar(n, false); });
      cont.appendChild(b);
      return b;
    });
    cont.addEventListener("mouseleave", function () { marcar(miVoto, true); });
    cont.addEventListener("focusout", function () { marcar(miVoto, true); });

    function marcar(hasta, esMio) {
      estrellas.forEach(function (b, i) {
        b.classList.toggle("on", i < hasta);
        b.classList.toggle("mia", esMio && i < hasta);
      });
    }

    function pintarResumen() {
      var total = 0, suma = 0;
      for (var n = 1; n <= 5; n++) { total += votos["s" + n]; suma += n * votos["s" + n]; }
      if (!total) { resumen.textContent = "Sé el primero en valorar"; }
      else {
        var prom = (suma / total).toFixed(1).replace(".", ",");
        resumen.replaceChildren();
        resumen.appendChild(document.createTextNode(prom + " "));
        var s = document.createElement("small");
        s.textContent = "(" + total + (total === 1 ? " voto)" : " votos)");
        resumen.appendChild(s);
      }
      marcar(miVoto, true);
    }

    function cargarVotos() {
      if (!db) {
        try { var l = JSON.parse(leer(KEY_LOCAL) || "null"); if (l) votos = l; } catch (e) {}
        pintarResumen(); return;
      }
      fetch(db + "/valoraciones.json", { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (d) {
          d = d || {};
          for (var n = 1; n <= 5; n++) votos["s" + n] = Math.max(0, +d["s" + n] || 0);
          pintarResumen();
        })
        .catch(function () { resumen.textContent = "Valoraciones no disponibles"; });
    }

    function votar(n) {
      if (ocupado || n === miVoto) return;
      ocupado = true;
      estrellas.forEach(function (b) { b.disabled = true; });
      var anterior = miVoto;

      function listo() {
        miVoto = n; guardar(KEY_MIA, String(n));
        ocupado = false;
        estrellas.forEach(function (b) { b.disabled = false; });
        pintarResumen();
        decir(anterior ? "Cambiaste tu voto. ¡Gracias!" : "¡Gracias por tu valoración!");
      }
      function fallo() {
        ocupado = false;
        estrellas.forEach(function (b) { b.disabled = false; });
        marcar(miVoto, true);
        decir("No se pudo guardar tu voto. Intenta de nuevo.");
      }

      if (!db) {
        if (anterior) votos["s" + anterior] = Math.max(0, votos["s" + anterior] - 1);
        votos["s" + n] += 1;
        guardar(KEY_LOCAL, JSON.stringify(votos));
        listo(); return;
      }

      // Incrementos atómicos de Firebase: nunca se pisan votos de varias personas a la vez.
      var cambio = {};
      cambio["s" + n] = { ".sv": { increment: 1 } };
      if (anterior) cambio["s" + anterior] = { ".sv": { increment: -1 } };
      fetch(db + "/valoraciones.json", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cambio)
      }).then(function (r) { if (!r.ok) throw new Error(r.status); })
        .then(function () { listo(); cargarVotos(); })
        .catch(fallo);
    }

    cargarVotos();
  })();
</script>
</body>
</html>
